<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#002e4b"/>
  
  <!-- Reciprocal Lattice / Crystal Bonds -->
  <path d="M32 12 L50 22 L50 42 L32 52 L14 42 L14 22 Z" stroke="#00456d" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  
  <!-- Inner Quantum / Orbitals -->
  <circle cx="32" cy="32" r="14" stroke="#006399" stroke-width="1.8" stroke-dasharray="4 2" fill="#00313a" fill-opacity="0.4"/>
  <ellipse cx="32" cy="32" rx="19" ry="7.5" transform="rotate(-30 32 32)" stroke="#58d6f1" stroke-width="1.4" stroke-opacity="0.85"/>
  <ellipse cx="32" cy="32" rx="19" ry="7.5" transform="rotate(30 32 32)" stroke="#62b5f8" stroke-width="1.4" stroke-opacity="0.85"/>
  
  <!-- Lattice Nodes -->
  <circle cx="32" cy="12" r="2.5" fill="#58d6f1"/>
  <circle cx="50" cy="22" r="2.5" fill="#58d6f1"/>
  <circle cx="50" cy="42" r="2.5" fill="#58d6f1"/>
  <circle cx="32" cy="52" r="2.5" fill="#58d6f1"/>
  <circle cx="14" cy="42" r="2.5" fill="#58d6f1"/>
  <circle cx="14" cy="22" r="2.5" fill="#58d6f1"/>
  
  <!-- Central Polaron / Particle Core -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2" fill="#002e4b"/>
</svg>
