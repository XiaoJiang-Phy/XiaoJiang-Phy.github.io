<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Topology-dependent parameter storage at a fixed six-dimensional grid</title>
  <desc id="desc">A logarithmic comparison of the stored-parameter fraction for successful Rainbow and Crossed Holstein toy-model tensor cross interpolation benchmarks on the same 16 by 16 grid.</desc>
  <rect width="1280" height="720" fill="#fbfcfe"/>
  <rect x="48" y="42" width="1184" height="636" rx="18" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/>

  <text x="92" y="98" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.2">SIX-DIMENSIONAL TCI BENCHMARK</text>
  <text x="92" y="148" fill="#10233f" font-family="Georgia, 'Times New Roman', serif" font-size="42">Topology-dependent parameter storage</text>
  <text x="92" y="184" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="19">Fixed grid: Nτ = 16 · Nk = 16 · 16,777,216 logical tensor entries</text>
  <line x1="92" y1="218" x2="1188" y2="218" stroke="#d9e1ea" stroke-width="2"/>

  <text x="410" y="264" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">STORED PARAMETER FRACTION  NTT / Nfull</text>
  <line x1="410" y1="292" x2="1128" y2="292" stroke="#8ca0b5" stroke-width="2"/>
  <g fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
    <line x1="410" y1="286" x2="410" y2="300" stroke="#8ca0b5" stroke-width="2"/><text x="410" y="324">0.01%</text>
    <line x1="649" y1="286" x2="649" y2="300" stroke="#8ca0b5" stroke-width="2"/><text x="649" y="324">0.1%</text>
    <line x1="889" y1="286" x2="889" y2="300" stroke="#8ca0b5" stroke-width="2"/><text x="889" y="324">1%</text>
    <line x1="1128" y1="286" x2="1128" y2="300" stroke="#8ca0b5" stroke-width="2"/><text x="1128" y="324">10%</text>
  </g>

  <line x1="92" y1="403" x2="1128" y2="403" stroke="#e7edf4" stroke-width="2"/>
  <text x="92" y="374" fill="#1d4f91" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Rainbow</text>
  <text x="92" y="402" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="16">successful configuration · n_rook = 5 · χcap = 64</text>
  <line x1="410" y1="381" x2="633" y2="381" stroke="#3b82c4" stroke-width="10" stroke-linecap="round"/>
  <circle cx="633" cy="381" r="13" fill="#1f77b4" stroke="#ffffff" stroke-width="4"/>
  <text x="662" y="373" fill="#10233f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">0.0682%</text>
  <text x="662" y="401" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="17">11,440 parameters · χ = 39 · 1,466.5× compression</text>
  <text x="662" y="428" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="16">internal residual 7.82 × 10⁻⁹</text>

  <line x1="92" y1="539" x2="1128" y2="539" stroke="#e7edf4" stroke-width="2"/>
  <text x="92" y="510" fill="#a84614" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Crossed</text>
  <text x="92" y="538" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="16">successful configuration · n_rook = 3 · χcap = 192</text>
  <line x1="410" y1="517" x2="956" y2="517" stroke="#d66a2c" stroke-width="10" stroke-linecap="round"/>
  <rect x="943" y="504" width="26" height="26" rx="4" fill="#d55e00" stroke="#ffffff" stroke-width="4"/>
  <text x="986" y="509" fill="#10233f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">1.8917%</text>
  <text x="410" y="564" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="17">317,376 parameters · χ = 183 · 52.9× compression · internal residual 9.71 × 10⁻⁹</text>

  <rect x="92" y="603" width="1096" height="46" rx="10" fill="#f3f6fa"/>
  <text x="116" y="632" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="16">Observed successful configurations · ScaledOracle · accumulative rook TCI · parameter storage only; internal residual is not a full-tensor error.</text>
</svg>
